services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: engineer
      POSTGRES_PASSWORD: engineer
      POSTGRES_DB: engineer
    ports: ["5432:5432"]
    volumes: ["workspace-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engineer"]
      interval: 5s
      retries: 10
  web:
    build: ./web
    ports: ["3000:3000"]
    env_file: ./web/.env
    environment:
      DATABASE_URL: postgresql://engineer:engineer@db:5432/engineer
    depends_on:
      db:
        condition: service_healthy
volumes:
  workspace-db:
